name: registry

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 扫描 registry 中登记的技能
        run: node scripts/scan-registry.js
      - name: 提交榜单更新
        run: |
          git config user.name "skill-lint bot"
          git config user.email "actions@users.noreply.github.com"
          git add registry/results.json registry/history.jsonl docs/leaderboard.md
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 更新 skills 安全分榜单"
            git push
          fi
