name: skill-lint

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: 扫描示例技能
        uses: ./
        with:
          path: examples/good-skill
          fail-on: low
          sarif-file: skill-lint.sarif
      - name: 上传 SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: skill-lint.sarif
